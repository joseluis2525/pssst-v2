<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pssst - ZX Spectrum</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: Arial, sans-serif; background: #050505; color: #fff;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden; touch-action: none;
            user-select: none; -webkit-user-select: none;
        }
        #game-header { width: 100%; max-width: 600px; text-align: center; padding: 5px; background: #111; border-bottom: 2px solid #4caf50; }
        #game-header h1 { font-size: 1.1em; color: #4caf50; margin: 0; }
        #status { font-size: 0.75em; color: #aaa; margin: 5px 0; min-height: 1.2em; padding: 0 5px; }

        .game-selector {
            display: flex; gap: 5px; justify-content: center; flex-wrap: wrap;
            padding: 6px 5px; background: #0a0a14;
        }
        .upload-btn {
            display: inline-block; background: #333; border: 1px solid #4caf50;
            padding: 6px 15px; border-radius: 5px; font-size: 0.8em; color: #4caf50;
            cursor: pointer; user-select: none;
        }
        #manual-load { display: none; }

        #emulator-container {
            width: 100%; max-width: 600px; background: #000; padding: 2px;
        }
        #jsspeccy { width: 100%; aspect-ratio: 4/3; border: 2px solid #333; position: relative; }
        #jsspeccy canvas { width: 100% !important; height: 100% !important; image-rendering: pixelated; outline: none; }

        /* Input invisible para capturar teclado del sistema si hace falta */
        #hidden-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            width: 1px; height: 1px;
            left: -9999px;
        }

        #gamepad-area {
            width: 100%; max-width: 600px; background: #1a1a2e;
            padding: 10px; border: 1px solid #333;
        }

        .dpad-layout {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 15px;
        }

        .dpad-col-left, .dpad-col-right {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background-color: #333;
            border: 2px solid #555;
            border-radius: 50%;
            width: 70px; height: 70px;
            display: flex; justify-content: center; align-items: center;
            font-size: 0.85em; font-weight: bold;
            color: #fff;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none; -webkit-user-select: none;
        }
        .btn:active, .btn.active { background-color: #4caf50 !important; color: #000 !important; }

        .btn-action {
            width: 90px; height: 90px;
            background: #a93226;
            border: 3px solid #e6b0aa;
        }
        .btn-action:active, .btn-action.active { background: #4caf50 !important; }
    </style>
</head>
<body>

    <div id="game-header">
        <h1>🐛 Pssst</h1>
        <div id="status">Iniciando emulador...</div>
    </div>

    <div class="game-selector">
        <label for="manual-load" class="upload-btn">📂 ROM manual</label>
        <input type="file" id="manual-load" accept=".tap">
    </div>

    <div id="emulator-container">
        <div id="jsspeccy">
            <input type="text" id="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
    </div>

    <div id="gamepad-area">
        <div class="dpad-layout">
            <!-- IZQUIERDA: O (izq) y P (der) -->
            <div class="dpad-col-left">
                <div class="btn" data-key="o">←</div>
                <div class="btn" data-key="p">→</div>
            </div>

            <!-- CENTRO: DISPARO -->
            <div id="btn-jump" class="btn btn-action" data-key="Space">FUEGO</div>

            <!-- DERECHA: Q (arriba) y A (abajo) -->
            <div class="dpad-col-right">
                <div class="btn" data-key="q">↑</div>
                <div class="btn" data-key="a">↓</div>
            </div>
        </div>
    </div>

    <script src="jsspeccy/jsspeccy.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const statusEl = document.getElementById('status');
            const manualLoadInput = document.getElementById('manual-load');
            const hiddenInput = document.getElementById('hidden-input');

            let tapeLoaded = false;
            let typing = false;

            function setStatus(msg) {
                statusEl.textContent = msg;
                console.log('[STATUS]', msg);
            }
            const sleep = ms => new Promise(r => setTimeout(r, ms));

            const speccy = JSSpeccy(document.getElementById('jsspeccy'), {
                autoStart: true,
                sandbox: false,
                machine: 48,
                zoom: 1
            });

            function getCanvas() {
                return document.querySelector('#jsspeccy canvas');
            }

            async function loadTape(blob, filename) {
                try {
                    const file = new File([blob], filename, { type: 'application/octet-stream' });
                    const dt = new DataTransfer();
                    dt.items.add(file);
                    const dropEvent = new DragEvent('drop', {
                        bubbles: true, cancelable: true, dataTransfer: dt
                    });
                    document.getElementById('jsspeccy').dispatchEvent(dropEvent);
                    const canvas = getCanvas();
                    if (canvas) canvas.dispatchEvent(dropEvent);
                    document.dispatchEvent(dropEvent);
                    tapeLoaded = true;
                    setStatus('✅ Cinta insertada');
                    return true;
                } catch (err) {
                    setStatus('❌ Error: ' + err.message);
                    return false;
                }
            }

            function pressKey(key, code, keyCode, extraOpts) {
                const canvas = getCanvas();
                if (!canvas) return;
                const opts = Object.assign({
                    key: key, code: code, keyCode: keyCode, which: keyCode,
                    bubbles: true, cancelable: true
                }, extraOpts || {});

                const down = new KeyboardEvent('keydown', opts);
                const up = new KeyboardEvent('keyup', opts);

                Object.defineProperty(down, 'keyCode', { get: () => keyCode });
                Object.defineProperty(down, 'which', { get: () => keyCode });
                Object.defineProperty(up, 'keyCode', { get: () => keyCode });
                Object.defineProperty(up, 'which', { get: () => keyCode });

                canvas.dispatchEvent(down);
                document.dispatchEvent(down);
                window.dispatchEvent(down);
                setTimeout(() => {
                    canvas.dispatchEvent(up);
                    document.dispatchEvent(up);
                    window.dispatchEvent(up);
                }, 60);
            }

            async function pressSymbolShift(letter, code, keyCode) {
                const canvas = getCanvas();
                if (!canvas) return;
                const ssDown = new KeyboardEvent('keydown', {
                    key: 'Control', code: 'ControlLeft', keyCode: 17, which: 17,
                    ctrlKey: true, bubbles: true, cancelable: true
                });
                Object.defineProperty(ssDown, 'keyCode', { get: () => 17 });
                Object.defineProperty(ssDown, 'which', { get: () => 17 });
                canvas.dispatchEvent(ssDown);
                document.dispatchEvent(ssDown);
                await sleep(120);
                pressKey(letter, code, keyCode, { ctrlKey: true });
                await sleep(150);
                const ssUp = new KeyboardEvent('keyup', {
                    key: 'Control', code: 'ControlLeft', keyCode: 17, which: 17,
                    ctrlKey: false, bubbles: true, cancelable: true
                });
                Object.defineProperty(ssUp, 'keyCode', { get: () => 17 });
                Object.defineProperty(ssUp, 'which', { get: () => 17 });
                canvas.dispatchEvent(ssUp);
                document.dispatchEvent(ssUp);
                await sleep(120);
            }

            async function typeLoadCommand() {
                if (typing) return;
                typing = true;
                setStatus('⌨️ Escribiendo LOAD ""...');
                const canvas = getCanvas();
                if (!canvas) { typing = false; return; }
                canvas.focus();
                await sleep(500);
                pressKey('Enter', 'Enter', 13);
                await sleep(400);
                pressKey('j', 'KeyJ', 74);
                await sleep(400);
                await pressSymbolShift('p', 'KeyP', 80);
                await sleep(300);
                await pressSymbolShift('p', 'KeyP', 80);
                await sleep(300);
                pressKey('Enter', 'Enter', 13);
                setStatus('▶ LOAD "" enviado. Espera a que cargue...');
                typing = false;
            }

            async function loadGame() {
                if (typeof speccy.reset === 'function') {
                    try { speccy.reset(); } catch(e) {}
                }
                tapeLoaded = false;
                await sleep(1500);
                setStatus('Descargando pssst.tap...');
                try {
                    const r = await fetch('pssst.tap?t=' + Date.now());
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    const blob = await r.blob();
                    await loadTape(blob, 'pssst.tap');
                    await sleep(2000);
                    await typeLoadCommand();
                } catch (err) {
                    setStatus('❌ Error: ' + err.message);
                }
            }

            let tries = 0;
            const interval = setInterval(() => {
                tries++;
                if (getCanvas()) {
                    clearInterval(interval);
                    // Añadir tabindex al canvas para que pueda recibir foco
                    const c = getCanvas();
                    if (c) {
                        c.setAttribute('tabindex', '0');
                        c.addEventListener('click', () => c.focus());
                        c.addEventListener('touchstart', () => c.focus(), { passive: true });
                    }
                    setTimeout(() => loadGame(), 800);
                }
                if (tries > 50) { clearInterval(interval); setStatus('⚠️ Canvas no detectado.'); }
            }, 200);

            manualLoadInput.addEventListener('change', async function(event) {
                const file = event.target.files[0];
                if (!file) return;
                setStatus('Insertando: ' + file.name);
                const blob = file.slice(0, file.size, 'application/octet-stream');
                await loadTape(blob, file.name);
                await sleep(2000);
                await typeLoadCommand();
            });

            // ============================================================
            // MAPEO DE TECLAS DE PSSST
            // O=izq, P=der, Q=arriba, A=abajo, Space=fuego
            // ============================================================
            const keyMap = {
                'o': { key: 'o', code: 'KeyO', keyCode: 79 },
                'p': { key: 'p', code: 'KeyP', keyCode: 80 },
                'q': { key: 'q', code: 'KeyQ', keyCode: 81 },
                'a': { key: 'a', code: 'KeyA', keyCode: 65 },
                'Space': { key: ' ', code: 'Space', keyCode: 32 },
                'CapsShift': { key: 'Shift', code: 'ShiftLeft', keyCode: 16 }
            };

            function sendGamepadKey(keyName, isDown) {
                const canvas = getCanvas();
                if (!canvas) return;
                canvas.focus();
                // Intentar foco también en hidden input por si ayuda
                if (hiddenInput) { try { hiddenInput.focus(); } catch(e) {} }
                const c = getCanvas();
                if (c) c.focus();

                const info = keyMap[keyName];
                if (!info) {
                    console.warn('[KEY] No keyMap para', keyName);
                    return;
                }
                console.log('[KEY]', keyName, isDown ? 'DOWN' : 'UP', 'keyCode=' + info.keyCode);

                const eventType = isDown ? 'keydown' : 'keyup';
                const evt = new KeyboardEvent(eventType, {
                    key: info.key,
                    code: info.code,
                    keyCode: info.keyCode,
                    which: info.keyCode,
                    bubbles: true,
                    cancelable: true
                });
                Object.defineProperty(evt, 'keyCode', { get: () => info.keyCode });
                Object.defineProperty(evt, 'which', { get: () => info.keyCode });

                // Enviar a TODOS los destinos posibles
                const target = getCanvas();
                if (target) target.dispatchEvent(evt);
                document.dispatchEvent(evt);
                window.dispatchEvent(evt);
            }

            document.querySelectorAll('.btn').forEach(btn => {
                const key = btn.getAttribute('data-key');
                if (!key) return;
                let touchHandled = false;

                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    touchHandled = true;
                    btn.classList.add('active');
                    sendGamepadKey(key, true);
                }, { passive: false });
                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    btn.classList.remove('active');
                    sendGamepadKey(key, false);
                    setTimeout(() => { touchHandled = false; }, 300);
                }, { passive: false });
                btn.addEventListener('touchcancel', (e) => {
                    e.preventDefault();
                    btn.classList.remove('active');
                    sendGamepadKey(key, false);
                }, { passive: false });
                btn.addEventListener('mousedown', (e) => {
                    if (touchHandled) return;
                    e.preventDefault();
                    btn.classList.add('active');
                    sendGamepadKey(key, true);
                });
                btn.addEventListener('mouseup', (e) => {
                    if (touchHandled) return;
                    e.preventDefault();
                    btn.classList.remove('active');
                    sendGamepadKey(key, false);
                });
                btn.addEventListener('mouseleave', () => {
                    btn.classList.remove('active');
                });
            });

            window.addEventListener('contextmenu', e => e.preventDefault());
        });
    </script>
</body>
</html>
